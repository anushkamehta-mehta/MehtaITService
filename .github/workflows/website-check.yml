
name: Website Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-website:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Check required website files
        run: |
          set -eu
          for file in index.html about.html services.html team.html contact.html style.css script.js; do
            if [ ! -s "$file" ]; then
              echo "ERROR: $file is missing or empty"
              exit 1
            fi
            echo "OK: $file exists and is not empty"
          done

      - name: Show successful validation
        run: echo "All required website files passed validation!"
